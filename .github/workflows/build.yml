name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.webalance.app

      # السطر الرسمي لتعطيل فحص جوجل الصارم
      - name: Bypass Proguard Check
        run: |
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      # تعديل مسار الملف القديم في كاش المكتبة
      - name: Fix InAppWebView Proguard
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: we-balance-app
          path: build/app/outputs/flutter-apk/app-debug.apk
