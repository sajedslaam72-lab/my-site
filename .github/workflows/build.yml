name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.webalance.app

      # تعطيل فحص تضارب أرقام أندرويد في مكتبة اختيار الملفات
      - name: Disable AarMetadata Check
        run: |
          cat << 'EOF' >> android/build.gradle

          allprojects {
              tasks.matching { it.name.contains("AarMetadata") }.configureEach {
                  enabled = false
              }
          }
          EOF

      # حقن الصلاحيات مع حل تعارض exported وإذن قراءة الصوتيات
      - name: Configure Android Permissions and Background Service
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          if 'xmlns:tools' not in content:
              content = content.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"')

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
          """
          content = content.replace('<application', permissions + '\n    <application')

          service_tag = """
                  <service
                      android:name="id.flutter.flutter_background_service.BackgroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="true"
                      tools:replace="android:exported" />
          """
          content = content.replace('</application>', service_tag + '\n    </application>')

          with open(path, 'w') as f:
              f.write(content)
          EOF

      - name: Bypass Proguard Check
        run: |
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties

      - name: Enable Desugaring for Notifications
        run: |
          python3 - << 'EOF'
          import glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path, 'r') as f:
                  text = f.read()
              if 'coreLibraryDesugaring' not in text:
                  if path.endswith('.kts'):
                      text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                      text += '\ndependencies {\n    add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  else:
                      text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                      text += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                  with open(path, 'w') as f:
                      f.write(text)
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix InAppWebView Proguard
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: we-balance-app
          path: build/app/outputs/flutter-apk/app-debug.apk
