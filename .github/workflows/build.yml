name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.webalance.app

      - name: Accept Android SDK Licenses & Prepare API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      # حقن الصلاحيات وخدمة الخلفية وإذن قراءة الوسائط
      - name: Configure Android Permissions and Background Service
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()

          if 'xmlns:tools' not in content:
              content = content.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"')

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
          """
          content = content.replace('<application', permissions + '\n    <application')

          service_tag = """
                  <service
                      android:name="id.flutter.flutter_background_service.BackgroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="true"
                      tools:replace="android:exported" />
          """
          content = content.replace('</application>', service_tag + '\n    </application>')

          with open(path, 'w') as f:
              f.write(content)
          EOF

      # ضبط التوافق ورفع compileSdk لكل المكتبات لـ 36
      - name: Force CompileSDK 36 across all subprojects
        run: |
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true

      - name: Enable Desugaring for Notifications
        run: |
          python3 - << 'EOF'
          import glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path, 'r') as f:
                  text = f.read()
              if 'coreLibraryDesugaring' not in text:
                  if path.endswith('.kts'):
                      text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                      text += '\ndependencies {\n    add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  else:
                      text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                      text += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                  with open(path, 'w') as f:
                      f.write(text)
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix InAppWebView Proguard
        run: |
          find /home/runner/.pub-cache/ -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true

      # بناء التطبيق والتقاط ملف الـ APK ونقله لمجلد التحميل
      - name: Build APK and Locate File
        run: |
          flutter build apk --debug || true
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          echo "Found generated APK at: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-debug.apk
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: we-balance-app
          path: build/app/outputs/flutter-apk/app-debug.apk
